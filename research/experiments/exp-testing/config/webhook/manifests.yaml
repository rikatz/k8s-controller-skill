---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-demo-example-com-v1-widget
  failurePolicy: Fail
  name: vwidget.demo.example.com
  rules:
  - apiGroups:
    - demo.example.com
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - widgets
  sideEffects: None
