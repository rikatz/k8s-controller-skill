apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gadgets.demo.example.com
spec:
  group: demo.example.com
  names:
    plural: gadgets
    singular: gadget
    kind: Gadget
    listKind: GadgetList
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: integer
                  x-kubernetes-validations:
                    - rule: "oldSelf <= 10"
                      message: "the previous size must have been <= 10"
                mode:
                  type: string
            status:
              type: object
              properties:
                ready:
                  type: boolean
