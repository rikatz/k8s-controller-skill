apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gadgets.demo.example.com
spec:
  group: demo.example.com
  names:
    plural: gadgets
    singular: gadget
    kind: Gadget
    listKind: GadgetList
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: integer
                mode:
                  type: string
                ports:
                  type: array
                  maxItems: 10
                  x-kubernetes-list-type: atomic
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        maxLength: 63
                        x-kubernetes-validations:
                          - rule: "self == oldSelf"
                            message: "name is immutable"
                labels:
                  type: array
                  maxItems: 10
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    maxLength: 63
                    x-kubernetes-validations:
                      - rule: "self == oldSelf"
                        message: "labels are immutable"
            status:
              type: object
              properties:
                ready:
                  type: boolean
