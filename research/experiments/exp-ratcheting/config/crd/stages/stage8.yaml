apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gadgets.demo.example.com
spec:
  group: demo.example.com
  names:
    plural: gadgets
    singular: gadget
    kind: Gadget
    listKind: GadgetList
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: integer
                mode:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                  x-kubernetes-validations:
                    - rule: "self.all(x, self.exists(y, y == x))"
                      message: "pairs every tag with every other tag (deliberately expensive, unbounded list)"
                note:
                  type: string
                  x-kubernetes-validations:
                    - rule: "self.contains('a string')"
                      message: "contains() over an unbounded string (the docs' own string example)"
            status:
              type: object
              properties:
                ready:
                  type: boolean
