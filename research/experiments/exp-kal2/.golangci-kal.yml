version: "2"
linters:
  default: none
  enable:
    - kubeapilinter
  settings:
    custom:
      kubeapilinter:
        type: module
        description: KAL
        settings:
          linters:
            enable: [defaults, defaultorrequired, optionalfields, optionalorrequired]
            disable: ["*"]
          lintersConfig:
            optionalfields:
              pointers:
                preference: WhenRequired
            defaults:
              preferredDefaultMarker: kubebuilder:default
issues:
  uniq-by-line: false
