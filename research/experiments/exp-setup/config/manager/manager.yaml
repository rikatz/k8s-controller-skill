apiVersion: apps/v1
kind: Deployment
metadata:
  name: widget-controller
  namespace: widget-system
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: widget-controller}
  template:
    metadata:
      labels: {app.kubernetes.io/name: widget-controller}
    spec:
      serviceAccountName: widget-controller
      terminationGracePeriodSeconds: 60   # must exceed --graceful-shutdown-timeout (30s)
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: manager
          image: example.com/widget-controller:latest
          args: [--leader-elect=true, --health-probe-bind-address=:8081]
          ports:
            - {name: probes, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
