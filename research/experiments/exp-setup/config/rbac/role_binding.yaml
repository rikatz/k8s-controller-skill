apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: widget-controller-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manager-role
subjects:
  - kind: ServiceAccount
    name: widget-controller
    namespace: widget-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: widget-controller-leader-election
  namespace: widget-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: widget-controller-leader-election
subjects:
  - kind: ServiceAccount
    name: widget-controller
    namespace: widget-system
